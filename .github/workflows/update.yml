name: update

on:
  schedule:
    - cron: '*/15 13-21 * * 1-5'   # 미국장 전후 15분마다 (UTC)
    - cron: '0 22,23 * * 1-5'      # 마감 후 확정 신호 백업 실행
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test:
        description: '테스트 푸시 보내기'
        type: boolean
        default: false
      unfilled:
        description: '체결 못함 날짜 (YYYY-MM-DD) — 그날 종가에서 다시 시작'
        type: string
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: 체결 못함 기록
        if: ${{ inputs.unfilled != '' && inputs.unfilled != null }}
        env:
          UNFILLED: ${{ inputs.unfilled }}
        run: |
          node -e "
            const fs = require('fs'), d = process.env.UNFILLED.trim(), f = 'docs/data/corrections.json';
            if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { console.error('날짜 형식 오류:', d); process.exit(1); }
            const a = fs.existsSync(f) ? JSON.parse(fs.readFileSync(f, 'utf8')) : [];
            if (!a.includes(d)) a.push(d);
            fs.writeFileSync(f, JSON.stringify(a.sort()) + '\n');
            console.log('체결 못함 기록:', d);
          "
      - run: node scripts/update.mjs
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: https://${{ github.repository_owner }}.github.io/
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          TEST_PUSH: ${{ inputs.test }}
      - name: 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "data update"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true   # GitHub 일시 오류 시 다음 실행(15분 후)에 다시 배포됨
